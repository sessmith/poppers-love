<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>10,000 Kisses 💋</title>
  <style>
    :root{
      --bg:#fff0f6;
      --card:#fff;
      --accent:#ff6fa3;
    }
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
    body{
      background: linear-gradient(180deg, var(--bg), #ffeaf2);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card{
      width:min(1100px,98%);
      max-height:90vh;
      background:var(--card);
      border-radius:14px;
      box-shadow:0 8px 30px rgba(0,0,0,0.08);
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:12px;
      overflow:hidden;
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    h1{margin:0;font-size:20px;color:#7a0b3a;letter-spacing:0.2px}
    .controls{display:flex;gap:8px;align-items:center}
    button{
      padding:8px 12px;border-radius:10px;border:0;cursor:pointer;font-weight:600;
      background:linear-gradient(180deg,var(--accent),#ff3f7a);color:white;
      box-shadow:0 4px 10px rgba(255,95,150,0.18);
    }
    button.ghost{background:transparent;color:var(--accent);box-shadow:none;border:1px solid rgba(122,11,58,0.08)}
    .info{font-size:13px;color:#6b2b44}
    .kissesWrap{
      overflow:auto;
      padding:14px;
      border-radius:10px;
      background:linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.4));
      border:1px dashed rgba(122,11,58,0.06);
      flex:1;
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }
    .kisses{
      font-size:22px;
      line-height:1.6;
      word-break:break-word;
      text-align:center;
      width:100%;
      max-width:1000px;
      padding:6px;
      user-select:text;
      letter-spacing:2px;
    }
    .footer{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#6b2b44}
    .count{font-weight:700;color:var(--accent)}
    /* subtle floating hearts animation (decorative) */
    .float-emoji{
      position:fixed;right:18px;bottom:18px;font-size:18px;opacity:0.9;pointer-events:none;
      animation:floatUp 6s linear infinite;
    }
    @keyframes floatUp{
      0%{transform:translateY(0) rotate(0deg)}
      50%{transform:translateY(-18px) rotate(8deg)}
      100%{transform:translateY(0) rotate(0deg)}
    }
  </style>
</head>
<body>
  <div class="card" role="main" aria-label="10,000 kisses">
    <header>
      <div>
        <h1>10,000 Kisses 💋</h1>
        <div class="info">A big wall of kisses — generated in your browser.</div>
      </div>
      <div class="controls">
        <label for="howMany" class="info" style="margin-right:6px">Count:</label>
        <input id="howMany" type="number" min="1" max="2000000" value="10000" style="width:110px;padding:6px;border-radius:8px;border:1px solid #ffd7e6" />
        <button id="generate">Generate</button>
        <button id="copy" class="ghost">Copy</button>
        <button id="download" class="ghost">Download</button>
      </div>
    </header>

    <div class="kissesWrap" id="wrap" aria-live="polite">
      <div id="kisses" class="kisses" title="Ten-thousand kisses will appear here">
        <!-- generated kisses go here -->
      </div>
    </div>

    <div class="footer">
      <div>Tip: change the count and hit Generate — you can make more or fewer kisses.</div>
      <div><span class="count" id="countLabel">0</span> kisses</div>
    </div>
  </div>

  <div class="float-emoji">💞</div>

  <script>
    // Helper: generate the kisses string and inject efficiently
    const kissesEl = document.getElementById('kisses');
    const countLabel = document.getElementById('countLabel');
    const howMany = document.getElementById('howMany');
    const generateBtn = document.getElementById('generate');
    const copyBtn = document.getElementById('copy');
    const downloadBtn = document.getElementById('download');

    // Create the string of N kisses. Uses native repeat which is fast.
    function makeKisses(n){
      // Safety clamp: ensure integer and non-negative
      n = Math.max(0, Math.floor(Number(n) || 0));
      // Build in chunks if extremely large to avoid memory spike (but repeat is fine for 10k)
      const CHUNK = 5000;
      if (n <= CHUNK) return '💋'.repeat(n);
      let res = '';
      let full = Math.floor(n / CHUNK);
      let rem = n % CHUNK;
      const chunkStr = '💋'.repeat(CHUNK);
      for(let i=0;i<full;i++) res += chunkStr;
      if (rem) res += '💋'.repeat(rem);
      return res;
    }

    // Render function with simple spacing
    function render(n){
      countLabel.textContent = n;
      // Insert with spaces every 50 characters (optional) for nicer wrapping:
      const raw = makeKisses(n);
      // For performance, avoid creating huge HTML with lots of spans.
      // We'll insert as plain text but add thin spaces occasionally to allow wrapping.
      // Insert a thin space every 50 emojis so lines can break gracefully.
      const group = 50;
      if (n <= group) {
        kissesEl.textContent = raw;
        return;
      }
      // Build groups for readable lines
      let out = '';
      for (let i=0;i<n;i+=group){
        out += raw.slice(i, i+group) + (i+group < n ? '\n\n' : '');
      }
      kissesEl.textContent = out;
    }

    // Initial render
    render(10000);

    generateBtn.addEventListener('click', ()=>{
      const n = Math.min(1_000_000, Math.max(1, Number(howMany.value) || 10000)); // clamp to reasonable max
      howMany.value = n;
      // Small visual hint while generating
      generateBtn.disabled = true;
      generateBtn.textContent = 'Generating…';
      // Use requestAnimationFrame to let UI update
      requestAnimationFrame(()=> {
        render(n);
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate';
      });
    });

    copyBtn.addEventListener('click', async ()=>{
      try {
        const text = kissesEl.textContent || '';
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = 'Copied ✓';
        setTimeout(()=> copyBtn.textContent = 'Copy', 1500);
      } catch(e){
        alert('Copy failed. You can select the kisses and press Ctrl+C (Cmd+C).');
      }
    });

    downloadBtn.addEventListener('click', ()=>{
      const text = kissesEl.textContent || '';
      const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `kisses-${countLabel.textContent}.txt`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    // Keyboard shortcut: G to generate
    window.addEventListener('keydown', (e)=>{
      if ((e.key === 'g' || e.key === 'G') && (document.activeElement.tagName !== 'INPUT')) {
        e.preventDefault();
        generateBtn.click();
      }
    });
  </script>
</body>
</html>
